<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited — advntr</title>
<meta name="description" content="Someone wants your take on a trip. Open it in advntr.">
<meta name="robots" content="noindex">
<!-- Link preview. This URL's whole job is to be pasted into a group chat, so the
     unfurl IS the first impression. noindex above does not suppress these: it
     speaks to crawlers, not to the unfurlers iMessage/WhatsApp/Slack run.
     og:url is deliberately absent — the id varies per invite and a static
     canonical would collapse every invite's preview onto one link. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="advntr">
<meta property="og:title" content="You're invited to help pick the trip">
<meta property="og:description" content="Rate the options, argue for your favourite, and help lock one in. Opens in advntr.">
<meta property="og:image" content="https://advntr-landing.vercel.app/img/02-triphome.png">
<meta property="og:image:alt" content="An advntr trip with options to rate">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="You're invited to help pick the trip">
<meta name="twitter:description" content="Rate the options, argue for your favourite, and help lock one in. Opens in advntr.">
<meta name="twitter:image" content="https://advntr-landing.vercel.app/img/02-triphome.png">
<link rel="icon" type="image/png" href="/img/icon.png">
<style>
  :root {
    --bg: #0b0b0d;
    --card: #141417;
    --border: #232329;
    --text: #f4f4f5;
    --muted: #9d9da6;
    --accent: #ff4560;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 24px; width: 100%; }
  header { display: flex; justify-content: center; padding: 32px 0 8px; }
  .wordmark { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); text-decoration: none; }
  .wordmark span { color: var(--accent); }

  main { flex: 1; display: flex; align-items: center; }
  .card {
    width: 100%;
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 32px 28px; text-align: center;
  }
  .pitch { font-size: 21px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.3; margin: 0 0 8px; }
  .pitch .trip { color: var(--accent); }
  .meta { color: var(--muted); font-size: 15px; margin: 0 0 28px; }
  .cta {
    display: block; width: 100%; font-size: 17px; font-weight: 700; color: var(--bg);
    background: var(--text); padding: 16px 24px; border-radius: 999px; text-decoration: none;
    border: none; cursor: pointer; transition: transform .15s, opacity .15s;
  }
  .cta:hover { transform: translateY(-1px); opacity: .9; }
  .cta.secondary {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); margin-top: 12px;
  }
  .fallback { color: var(--muted); font-size: 14px; margin-top: 18px; }
  .fallback a { color: var(--text); }

  .state { color: var(--muted); font-size: 16px; text-align: center; padding: 24px 0; }
  .state a { color: var(--text); }

  footer {
    text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0 32px;
  }
  footer a { color: inherit; }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="/">advntr<span>.</span></a>
</header>

<main>
  <div class="wrap">
    <div id="content" class="state">Loading your invite&hellip;</div>
  </div>
</main>

<footer>
  <a href="/privacy.html">Privacy</a>
</footer>

<script>
(function () {
  // Publishable/anon key — safe to embed client-side, same one the app
  // ships (see adventure/.env.example). RLS protects data, not key secrecy.
  var SUPABASE_URL = 'https://vjsgvkercbtyzpdauswo.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_UM19CZ6ExmxXyzsgn4Flbg_KmLMIMXz';

  // Public TestFlight link, serving the moderated build (register §56).
  // Deep link is always tried first — see the click handler below — this
  // is only the fallback for people who don't have advntr installed yet.
  var STORE_URL = 'https://testflight.apple.com/join/TGDbMpqf';

  var content = document.getElementById('content');
  var id = decodeURIComponent(location.pathname.replace(/^\/(?:i|join)\//, '').replace(/\/$/, ''));

  // analytics_events landed (adventure 20260810000000_analytics_events.sql)
  // with an anon-insert policy built for exactly this — the joiner hasn't
  // opened the app yet, so there's no session to attach. Best-effort: no
  // await, no retry. The invite_store_redirect call fires right before
  // location.href changes, so it can lose the race against navigation same
  // as any fire-before-unload beacon; sendBeacon isn't usable here since it
  // can't carry the apikey/Authorization headers this endpoint needs.
  function track(name) {
    fetch(SUPABASE_URL + '/rest/v1/analytics_events', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      // `ref` mirrors what index.html has captured since 08-14. Without it,
      // all 29 invite-page events ever recorded read as ref-null, and an
      // invite opened from iMessage is indistinguishable from one opened
      // from a pasted URL — on the one page where the sharing channel is
      // the whole question. Empty string, not null, so a direct open is
      // distinguishable from a row written before this field existed.
      body: JSON.stringify({ kind: name, payload: { inviteId: id, page: 'invite', ref: document.referrer || '' } })
    }).catch(function () {});
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderInvalid() {
    content.className = 'state';
    content.innerHTML = 'This invite link isn’t valid anymore — it may have expired or been revoked.<br><br><a href="/">Learn about advntr &rarr;</a>';
  }

  function renderFound(invite) {
    track('invite_opened');
    var tripName = escapeHtml(invite.trip_name);
    var inviter = escapeHtml(invite.inviter_first_name || 'A friend');
    var draftWord = invite.draft_count === 1 ? 'place' : 'places';

    content.className = '';
    content.innerHTML =
      '<div class="card">' +
        '<p class="pitch">' + inviter + ' wants your take on <span class="trip">' + tripName + '</span></p>' +
        '<p class="meta">' + invite.draft_count + ' ' + draftWord + ' pitched' +
          (invite.member_count > 0 ? ' · ' + invite.member_count + ' already in' : '') + '</p>' +
        '<button class="cta" id="store-cta">Get advntr &amp; join</button>' +
        '<button class="cta secondary" id="open-cta">I already have advntr</button>' +
        '<p class="fallback">Free beta on TestFlight. Install it, come back here, ' +
          'and tap “I already have advntr”.</p>' +
      '</div>';

    // The person holding an invite link usually does NOT have the app — that
    // is what an invite is for. So the two destinations are now separate,
    // explicitly labelled buttons and NOTHING is attempted on their behalf.
    //
    // What this replaces, and why (blockers doc 2026-08-20): the single
    // "Open in advntr" button fired `advntr://join/<id>` unconditionally and
    // let a 1500ms timer fall through to TestFlight. On iOS, a custom scheme
    // that no installed app registers does not fail silently — Safari puts up
    // "Safari cannot open the page because the address is invalid." So every
    // genuine invitee was shown a system error, and the fallback then rescued
    // them *underneath an alert they had already read*. The CEO's mother hit
    // exactly this, called the link invalid, and was right.
    //
    // Register §58/§59 still holds — an installed tester must land IN THE
    // TRIP, never on TestFlight — and it holds better here than it did under
    // the timer: they pick their own door instead of racing one.
    document.getElementById('store-cta').addEventListener('click', function () {
      copyId();
      track('invite_store_tapped');
      location.href = STORE_URL;
    });

    document.getElementById('open-cta').addEventListener('click', function () {
      copyId();
      track('invite_open_app_tapped');
      location.href = 'advntr://join/' + id;
    });
  }

  // Must run inside the click handler — clipboard writes only resolve inside
  // a user gesture on iOS Safari (spec §4a).
  function copyId() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(id).catch(function () {});
    }
  }

  if (!id) {
    renderInvalid();
    return;
  }

  fetch(SUPABASE_URL + '/rest/v1/rpc/get_invite_preview', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
    },
    body: JSON.stringify({ p_invite_id: id })
  })
    .then(function (res) {
      if (!res.ok) throw new Error('bad response');
      return res.json();
    })
    .then(function (rows) {
      if (!rows || !rows.length) {
        renderInvalid();
        return;
      }
      renderFound(rows[0]);
    })
    .catch(function () {
      content.className = 'state';
      content.innerHTML = 'Couldn’t load this invite. Check your connection and reload.';
    });
})();
</script>

</body>
</html>
